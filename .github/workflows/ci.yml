name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m app.export_openapi
      - run: ruff check .
      - run: python -m pytest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: error

  migrations:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://testuser:testpass@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Start PostgreSQL
        run: |
          docker run -d --rm --name postgres-test \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpass \
            -e POSTGRES_DB=testdb \
            -p 5432:5432 \
            postgres:16
          for i in $(seq 1 30); do
            if docker exec postgres-test pg_isready -U testuser -d testdb; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Verify single Alembic head
        run: |
          heads="$(python -m alembic heads)"
          printf '%s\n' "$heads"
          count="$(printf '%s\n' "$heads" | grep -c ' (head)$' || true)"
          test "$count" -eq 1
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head