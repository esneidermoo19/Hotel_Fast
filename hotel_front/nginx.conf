server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revela la version de nginx en cabeceras ni paginas de error.
    server_tokens off;
    # La SPA solo sirve estaticos: limita el cuerpo de las peticiones.
    client_max_body_size 1m;

    # IP real del cliente: el trafico entra por Traefik (Coolify) desde la red
    # privada de Docker, que agrega X-Forwarded-For con la IP del cliente. Se
    # confia SOLO en rangos privados: una conexion directa desde Internet no es
    # "confiable", asi que un atacante no puede falsear su IP. Con
    # real_ip_recursive se toma el ultimo salto no confiable (el cliente real),
    # ignorando cualquier X-Forwarded-For inyectado por el cliente.
    # (Coolify usa subredes Docker dentro de estos rangos; si tu red es
    #  personalizada, agrega su CIDR con otro set_real_ip_from.)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # Rate limiting por IP (zona definida en 00-limits.conf): corta los escaneos.
    limit_req zone=perip burst=40 nodelay;
    # No registra los 404 (ruido de bots buscando archivos inexistentes).
    log_not_found off;
    # Cabeceras de seguridad (se repiten en las location con add_header propio).
    include /etc/nginx/snippets/security-headers.conf;
    # Escaneres conocidos (ver map en 00-limits.conf): corta sin responder.
    if ($bad_bot) {
        return 444;
    }

    # --- Seguridad: bloquear escaneos de bots -------------------------------

    # 1) Rutas ocultas en cualquier segmento: .env, .git, .aws, .claude, .ssh,
    #    etc. Al ser una regex se evalua ANTES del fallback de la SPA, asi que
    #    responde 404 directo (nunca sirve index.html). Se exceptua
    #    /.well-known para no romper los challenges ACME (Let's Encrypt).
    location ~ (^|/)\.(?!well-known) {
        access_log off;
        return 404;
    }

    # 2) Objetivos tipicos de bots que no son dotfiles.
    location ~* ^/(wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|actuator|telescope|vendor/phpunit) {
        access_log off;
        return 404;
    }

    # 3) Extensiones que la SPA jamas sirve (scripts, backups, configs).
    location ~* \.(php|phtml|asp|aspx|jsp|cgi|pl|py|rb|sh|bat|sql|bak|old|orig|swp|swo|ini|conf|log|yml|yaml|zip|tar|gz|tgz|rar|7z)$ {
        access_log off;
        return 404;
    }

    # --- Cache --------------------------------------------------------------

    # 4) Shell de la app y service worker: NUNCA cachear (no llevan hash), para
    #    que un redeploy se refleje al instante en el navegador.
    location ~* ^/(index\.html|flutter_bootstrap\.js|main\.dart\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # 5) Assets con hash de contenido: cache largo e inmutable (seguro).
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # 6) Otros estaticos (iconos, fuentes, imagenes): cache moderado.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # 7) SPA: cualquier ruta de la app entrega index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
