# Cabeceras de seguridad, reutilizables.
#
# IMPORTANTE: en Nginx, si una `location` define cualquier `add_header`, deja de
# heredar los del `server`. Por eso este snippet se incluye tanto en el `server`
# como en cada `location` que tenga sus propios `add_header`.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
