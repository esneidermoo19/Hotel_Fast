# Cabeceras de seguridad, reutilizables.
#
# IMPORTANTE: en Nginx, si una `location` define cualquier `add_header`, deja de
# heredar los del `server`. Por eso este snippet se incluye tanto en el `server`
# como en cada `location` que tenga sus propios `add_header`.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# Obliga a los navegadores a usar HTTPS durante un ano (solo aplica bajo HTTPS;
# el TLS lo termina el proxy, pero el header llega al navegador igual).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy compatible con Flutter Web (renderer CanvasKit):
#  - script-src: el propio bundle y el motor CanvasKit servido por Google.
#  - 'wasm-unsafe-eval': necesario para compilar WebAssembly (CanvasKit).
#  - style-src 'unsafe-inline': Flutter inyecta estilos en tiempo de ejecucion.
#  - img-src https: y el API: la app muestra imagenes servidas por la API.
#  - connect-src: llamadas fetch al API, descarga del wasm de CanvasKit y de
#    las fuentes web (Roboto/Noto) que el motor pide a fonts.gstatic.com.
#  - font-src: carga de esas mismas fuentes.
#  - worker-src blob:: Flutter registra workers desde blobs (skwasm).
# Si cambias el dominio del API (--dart-define=API_BASE_URL), actualiza
# connect-src e img-src aqui.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com https://www.api.ttr.lat; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
