# Rate limiting y bloqueos a nivel http.
#
# Este archivo se incluye DENTRO del bloque http (el nginx.conf principal hace
# `include /etc/nginx/conf.d/*.conf;`). El nombre `00-...` garantiza que se
# cargue antes de `default.conf`, donde se usa la zona `perip`.
#
# Nota: si el contenedor esta detras de un proxy/CDN, configura `real_ip`
# (set_real_ip_from / real_ip_header) para que $binary_remote_addr sea la IP
# real del cliente y no la del proxy.
limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
limit_req_status 429;

# User-Agents de escaneres conocidos -> $bad_bot = 1 (se corta con 444, sin
# respuesta). No detiene a los que falsean el UA, pero si a los escaneres
# ingenuos y reduce el ruido.
map $http_user_agent $bad_bot {
    default 0;
    ~*(sqlmap|nikto|nmap|masscan|zgrab|nuclei|dirbuster|gobuster|wfuzz|hydra|acunetix|nessus|wpscan|mongodb) 1;
}
